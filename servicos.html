    <main>
    <form action="obrigado.html" method="get">
        
        <fieldset>
            <legend>Dados Pessoais</legend>

            <div class="campo">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" placeholder="Seu Nome Completo" required minlength="3">
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="E-mail" required>
            </div>

            <div class="campo">
                <label for="telefone">Telefone para contato</label>
                <input type="text" id="telefone" name="telefone" placeholder="(11)99999-9999">
            </div>

        </fieldset>

        <fieldset>
            <legend>Mensagem</legend>

            <select id="assunto" name="assunto" required>
                <option value="">Selecione o Assunto</option>
                <option value="orcamento">Orçamento</option>
                <option value="parceria">Parceria</option>
                <option value="pacotes">Pacotes</option>
            </select>

            <textarea name="mensagem" id="mensagem" rows="5" minlength="20" maxlength="500" required
                placeholder="Fala mesmo"></textarea>
        </fieldset>

        <div class="botoes">
            <button type="reset">Limpar Tudo</button>
            <button type="submit">Enviar Mensagem</button>
        </div>

    </form>
